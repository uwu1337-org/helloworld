name: artifact-smoke-test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Create dummy artifact
        run: echo "test" > result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-test
          path: result.txt
